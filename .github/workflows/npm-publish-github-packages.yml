# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      
      # --- START: ADDED GEMINI CLI STEP ---
      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0.1.15
        with:
          # IMPORTANT: Update these values. 
          # You may need to specify a service_account_key for non-GitHub operations.
          # Example: service_account_key: ${{ secrets.GCP_SA_KEY }} 
          # Example: project_id: your-gcp-project-id
          command: |
            gemini --help
      # --- END: ADDED GEMINI CLI STEP ---

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
